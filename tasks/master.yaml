- name: Initialiser le cluster master
  command: >
    kubeadm init
    --apiserver-advertise-address={{ kubernetes_apiserver_advertise_address }}
    --pod-network-cidr={{ pod_network_cidr }}
    --cri-socket={{ cri_socket }}
    --kubernetes-version={{ k8s_version }}
  args:
    creates: /etc/kubernetes/admin.conf
  become: true

- name: Créer le répertoire .kube pour root
  file:
    path: /root/.kube
    state: directory
    mode: '0755'
  become: true

- name: Copier config kube pour root
  copy:
    src: /etc/kubernetes/admin.conf
    dest: /root/.kube/config
    remote_src: true
    mode: '0644'
  become: true

- name: Créer le répertoire .kube pour vagrant
  file:
    path: /home/vagrant/.kube
    state: directory
    owner: vagrant
    group: vagrant
    mode: '0755'
  become: true

- name: Copier config kube pour vagrant
  copy:
    src: /etc/kubernetes/admin.conf
    dest: /home/vagrant/.kube/config
    owner: vagrant
    group: vagrant
    mode: '0644'
  become: true

- name: Générer la commande join
  shell: kubeadm token create --print-join-command
  register: join_cmd
  become: true

- name: Sauvegarder la commande join dans un fichier partagé
  copy:
    dest: "{{ join_command_file }}"
    content: "{{ join_cmd.stdout }}"
  become: true

# - name: Installer CNI Flannel
#   kubernetes.core.k8s:
#     state: present
#     src: https://raw.githubusercontent.com/flannel-io/flannel/master/Documentation/kube-flannel.yml

- name: Télécharger le manifeste Flannel
  get_url:
    url: https://raw.githubusercontent.com/flannel-io/flannel/master/Documentation/kube-flannel.yml
    dest: /tmp/kube-flannel.yml
    mode: '0644'
    force: true
  become: true

# Sans --iface, flannel utilise l'interface de la route par defaut (NAT
# enp0s3, 10.0.2.15 identique sur chaque VM Vagrant, injoignable entre
# noeuds) comme extremite du tunnel VXLAN : les pods d'un noeud ne joignent
# alors pas ceux des autres (CoreDNS sur le master -> DNS KO sur le worker).
- name: Forcer flannel sur l'interface réseau privée
  replace:
    path: /tmp/kube-flannel.yml
    regexp: '^(\s*)- --kube-subnet-mgr$'
    replace: '\1- --kube-subnet-mgr\n\1- --iface={{ k8s_interface }}'
  become: true

- name: Installer CNI Flannel avec kubectl
  command: kubectl apply -f /tmp/kube-flannel.yml
  become: true
