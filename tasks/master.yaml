- name: Initialiser le cluster master
  command: >
    kubeadm init
    --apiserver-advertise-address={{ kubernetes_apiserver_advertise_address }}
    --pod-network-cidr={{ pod_network_cidr }}
    --cri-socket={{ cri_socket }}
    --kubernetes-version={{ k8s_version }}
  args:
    creates: /etc/kubernetes/admin.conf
  become: true

# Le kubeconfig admin n'est installe que pour root : l'utilisateur vagrant
# n'a volontairement aucun acces au cluster par defaut (les labs RBAC lui
# creent un kubeconfig avec des droits limites).
- name: Créer le répertoire .kube pour root
  file:
    path: /root/.kube
    state: directory
    mode: '0700'
  become: true

- name: Copier config kube pour root
  copy:
    src: /etc/kubernetes/admin.conf
    dest: /root/.kube/config
    remote_src: true
    mode: '0600'
  become: true

- name: Générer la commande join
  shell: kubeadm token create --print-join-command
  register: join_cmd
  become: true

- name: Sauvegarder la commande join dans un fichier partagé
  copy:
    dest: "{{ join_command_file }}"
    content: "{{ join_cmd.stdout }}"
  become: true

# - name: Installer CNI Flannel
#   kubernetes.core.k8s:
#     state: present
#     src: https://raw.githubusercontent.com/flannel-io/flannel/master/Documentation/kube-flannel.yml

# Sur cette topologie Vagrant a deux interfaces, une connexion locale vers
# une IP de Service (ex: 10.96.0.1) peut repartir avec l'IP de l'interface
# NAT comme source (le noyau choisit la source avant que le DNAT ne
# s'applique, car la destination d'origine ne correspond a aucune route
# specifique). Le noeud distant rejette alors ce paquet source incoherente
# avec sa table de routage : plus aucun trafic vers les IP de Service ne
# passe (Flannel, CoreDNS, etc. restent bloques en CrashLoopBackOff).
# masqueradeAll force kube-proxy a toujours reecrire la source avec la
# bonne IP de sortie.
- name: Activer masqueradeAll sur kube-proxy
  shell: |
    kubectl get cm kube-proxy -n kube-system -o yaml | sed 's/masqueradeAll: false/masqueradeAll: true/' | kubectl apply -f -
    kubectl delete pod -n kube-system -l k8s-app=kube-proxy --ignore-not-found
  environment:
    KUBECONFIG: /root/.kube/config
  become: true

- name: Télécharger le manifeste Flannel
  get_url:
    url: https://raw.githubusercontent.com/flannel-io/flannel/master/Documentation/kube-flannel.yml
    dest: /tmp/kube-flannel.yml
    mode: '0644'
    force: true
  become: true

# Sans --iface, flannel utilise l'interface de la route par defaut (NAT
# enp0s3, 10.0.2.15 identique sur chaque VM Vagrant, injoignable entre
# noeuds) comme extremite du tunnel VXLAN : les pods d'un noeud ne joignent
# alors pas ceux des autres (CoreDNS sur le master -> DNS KO sur le worker).
- name: Forcer flannel sur l'interface réseau privée
  replace:
    path: /tmp/kube-flannel.yml
    regexp: '^(\s*)- --kube-subnet-mgr$'
    replace: '\1- --kube-subnet-mgr\n\1- --iface={{ k8s_interface }}'
  become: true

- name: Installer CNI Flannel avec kubectl
  command: kubectl apply -f /tmp/kube-flannel.yml
  become: true
